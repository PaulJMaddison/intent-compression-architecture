[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ica-core"
version = "1.0.0"
description = "Historical/reference Intent Compression Architecture implementation in the lineage of KynticAI Clarity Gateway."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Paul Maddison" }
]
keywords = [
  "llm",
  "intent-resolution",
  "clarification",
  "orchestration",
  "expected-utility"
]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4,<5",
  "pytest>=8,<9"
]

[project.scripts]
ica = "ica_core.cli:main"

[project.urls]
Homepage = "https://github.com/PaulJMaddison/kynticai-clarity-gateway-reference"
Documentation = "https://github.com/PaulJMaddison/kynticai-clarity-gateway-reference#readme"
Evolution = "https://github.com/PaulJMaddison/kynticai-clarity-gateway-reference/blob/main/EVOLUTION.md"
Changelog = "https://github.com/PaulJMaddison/kynticai-clarity-gateway-reference/blob/main/CHANGELOG.md"
Repository = "https://github.com/PaulJMaddison/kynticai-clarity-gateway-reference"
Issues = "https://github.com/PaulJMaddison/kynticai-clarity-gateway-reference/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ica_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
