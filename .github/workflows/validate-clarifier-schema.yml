name: Validate Clarifier Schema

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema CLI dependency
        run: python -m pip install jsonschema

      - name: Validate schema example
        run: python -m jsonschema spec/clarifier_output.schema.json -i spec/clarifier_output.example.json
